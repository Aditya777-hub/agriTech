<section class="text-gray-600 body-font min-h-screen flex items-center bg-green-50">
  <div class="container px-5 mx-auto flex justify-center">
    <div class="w-full md:w-1/2 bg-white rounded-2xl p-10 flex flex-col shadow-lg border border-green-100 transform transition-all hover:shadow-xl hover:-translate-y-1">
      <div class="text-center mb-8">
        <h2 class="text-gray-900 text-3xl font-bold mb-3 title-font">Create Account</h2>
        <p class="leading-relaxed text-gray-600">Join our agricultural community to access premium solutions and resources</p>
      </div>
      <div class="relative mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input type="email" id="email" name="email" class="w-full bg-white rounded-lg border border-gray-300 focus:border-green-500 focus:ring-4 focus:ring-green-200 text-base outline-none text-gray-700 py-2 px-4 leading-8 transition-all duration-200 ease-in-out hover:border-green-300">
      </div>
      <div class="relative mb-8">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input type="password" id="password" name="password" class="w-full bg-white rounded-lg border border-gray-300 focus:border-green-500 focus:ring-4 focus:ring-green-200 text-base outline-none text-gray-700 py-2 px-4 leading-8 transition-all duration-200 ease-in-out hover:border-green-300">
      </div>
      <button class="text-white bg-green-600 border-0 py-3 px-8 focus:outline-none hover:bg-green-700 rounded-lg text-lg font-semibold transition-all duration-300 transform hover:scale-105 shadow-md hover:shadow-lg">
        Sign Up
      </button>
      <div class="text-center mt-6">
        <p class="text-sm text-gray-500">Already have an account? 
          <a href="#" class="text-green-600 font-medium hover:text-green-700 underline underline-offset-4 transition-colors duration-200">Login</a>
        </p>
      </div>
    </div>
  </div>
</section>
